-   id: secret-scanner
    name: 'Scan for secrets'
    description: 'This hook scans for secrets'
    entry: hooks/secrets.sh 
    language: system
    pass_filenames: false    # <— disables batching
    always_run: true         # <— ensures it runs even if no files match
    args: ["."]
-   id: sast-scanner
    name: 'Sast scan'
    description: 'Static application security testing'
    entry: hooks/sast.sh 
    language: system
    pass_filenames: false    # <— disables batching
    always_run: true         # <— ensures it runs even if no files match
    args: ["."]